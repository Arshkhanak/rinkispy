workflows:

  native-android:

    name: Native Android

    max_build_duration: 120

    instance_type: mac_mini_m1

    environment:

      android_signing:

        - Rinki

      vars:

        PACKAGE_NAME: "com.rinki.parent"

    scripts:

    

    - name: usr/local/share/android-sdk

      script: | 

         echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

    - name: Build Android release

      script: ./gradlew assemble release

    artifacts:

      - app/build/outputs/**/*.apk
