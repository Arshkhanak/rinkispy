workflows:

  native-android:

    name: Native Android

    max_build_duration: 120

    instance_type: mac_mini_m1

    environment:

      android_signing:

        - Rinki

      vars:

        PACKAGE_NAME: "com.rinki.parent"

    scripts:

      - name: Build Android debug

        script: ./gradlew assemble debug

    artifacts:

      - app/build/outputs/**/*.apk
