apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "com.mine.spy"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "2.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        buildTypes.each {
            it.buildConfigField("String", "PACKAGE_CHECK_SOCIAL", PACKAGE_CHECK_SOCIAL)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    kapt { generateStubs = true }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'

    testImplementation 'junit:junit:4.13'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    kapt 'androidx.lifecycle:lifecycle-compiler:2.2.0'

    implementation "com.google.firebase:firebase-auth:19.3.1"
    implementation "com.google.firebase:firebase-database:19.3.0"
    implementation "com.google.firebase:firebase-storage:19.1.1"
    implementation "com.google.firebase:firebase-core:17.4.3"
    implementation 'com.firebaseui:firebase-ui:5.1.0'

    implementation "com.google.android.gms:play-services-maps:17.0.0"

    implementation 'com.github.romancha:MaterialPlayPauseViewButton:1.0.1'

    implementation 'com.github.jakob-grabner:Circle-Progress-View:v1.3'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.github.clans:fab:1.6.4'

    implementation 'com.jaredrummler:material-spinner:1.3.1'

    implementation 'com.daimajia.androidanimations:library:2.3@aar'

    implementation 'com.github.f0ris.sweetalert:library:1.6.2'

    implementation 'com.github.ybq:Android-SpinKit:1.2.0'

    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation 'com.pawegio.kandroid:kandroid:0.8.7@aar'

    implementation 'androidx.core:core-ktx:1.3.0'

    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'com.jakewharton:kotterknife:0.1.0-SNAPSHOT'

    implementation 'com.google.dagger:dagger:2.25.3'
    kapt 'com.google.dagger:dagger-compiler:2.25.3'
    compileOnly 'org.glassfish:javax.annotation:10.0-b28'

    implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.5@aar'

    implementation 'com.jakewharton.rxbinding2:rxbinding-kotlin:2.1.1'

    implementation 'io.reactivex.rxjava2:rxkotlin:2.3.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'com.chrisplus.rootmanager:library:2.0.5@aar'

    implementation 'com.jaredrummler:android-device-names:1.1.9'

    implementation 'com.balysv:material-ripple:1.0.2'
    implementation 'com.wdullaer:materialdatetimepicker:3.2.0'
    implementation 'com.mikhaellopez:circularimageview:3.2.0'
    implementation 'com.github.pchmn:MaterialChipsInput:1.0.5'
    implementation 'com.hootsuite.android:nachos:1.1.1'
    implementation 'com.google.android:flexbox:0.3.2'
    implementation 'com.crystal:crystalrangeseekbar:1.1.3'

    implementation 'ru.github.igla:ferriswheel:1.2'
}

apply plugin: 'com.google.gms.google-services'
